<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语言分布 - 信创开源数据分析平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --surface-page:   #0d0d0d;
  --surface-1:      #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --border:         rgba(255,255,255,0.10);
  --series-1:       #3987e5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  min-height: 100vh;
}
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 28px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.navbar .brand { font-size: 17px; font-weight: 600; }
.navbar .btn-back {
  padding: 6px 16px; font-size: 12px; color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; text-decoration: none;
}
.navbar .btn-back:hover { border-color: var(--series-1); color: var(--series-1); }
.container { max-width: 1200px; margin: 0 auto; padding: 28px; display: flex; gap: 20px; }
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: var(--text-primary); }
.panel {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px 24px;
}
.chart-panel { flex: 1; }
.chart-box { width: 100%; height: 550px; }
.table-panel { width: 360px; }
.table-panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-panel th {
  text-align: left; padding: 8px 12px;
  color: var(--text-muted); font-weight: 500; font-size: 11px;
  border-bottom: 1px solid var(--border);
}
.table-panel td {
  padding: 8px 12px; color: var(--text-secondary);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.table-panel .num { text-align: right; color: var(--text-primary); font-weight: 500; }
.loading-text { color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<nav class="navbar">
  <span class="brand">📊 编程语言分布</span>
  <a class="btn-back" href="dashboard.html">← 返回工作台</a>
</nav>

<div class="container">
  <div class="panel chart-panel">
    <div class="chart-box" id="chart"></div>
  </div>
  <div class="panel table-panel">
    <h3 style="font-size:15px;margin-bottom:16px;color:var(--text-primary)">📋 语言排行</h3>
    <table>
      <thead><tr><th>#</th><th>语言</th><th>仓库数</th><th>占比</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const DARK_TEXT = '#c3c2b7';
const DARK_MUTED = '#898781';
const CAT_COLORS = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
function comma(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }

let chart;
function render(data) {
  if (!data || !data.length) return;

  let slices = data.slice(0, 7);
  if (data.length > 7) {
    const rest = data.slice(7).reduce((a,d) => { a.repoCount+=d.repoCount; a.totalStars+=d.totalStars; return a; }, {
language:'其他', repoCount:0, totalStars:0 });
    slices.push(rest);
  }

  const dom = document.getElementById('chart');
  if (chart) chart.dispose();
  chart = echarts.init(dom);
  chart.setOption({
    title: {
      text: '编程语言分布', subtext: '按仓库数统计',
      left: 'center', top: 8,
      textStyle: { color: '#ffffff', fontSize: 18, fontWeight: 600 },
      subtextStyle: { color: DARK_MUTED, fontSize: 12 }
    },
    tooltip: {
      trigger: 'item', backgroundColor: '#1a1a19', borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: p => `<strong>${p.name}</strong><br>仓库：${comma(p.value)}（${p.percent}%）`
    },
    legend: {
      orient: 'vertical', right: 8, top: 'center',
      textStyle: { color: DARK_TEXT, fontSize: 12 },
      itemWidth: 10, itemHeight: 10, itemGap: 10,
    },
    series: [{
      type: 'pie', radius: ['50%','76%'], center: ['40%','50%'],
      avoidLabelOverlap: false,
      itemStyle: { borderColor: '#1a1a19', borderWidth: 2, borderRadius: 3 },
      label: { show: true, position: 'inside', color: '#ffffff', fontSize: 11, formatter: p => p.percent>=5 ?
p.percent+'%' : '' },
      emphasis: { scaleSize: 6, label: { fontSize: 15, fontWeight: 'bold' } },
      data: slices.map((d,i) => ({ name: d.language, value: d.repoCount, itemStyle: { color: CAT_COLORS[i] } })),
    }],
  });

  document.getElementById('tableBody').innerHTML = data.slice(0, 15).map((d,i) =>
    `<tr>
      <td style="color:var(--text-muted);font-size:12px">${i+1}</td>
      <td>${d.language||'N/A'}</td>
      <td class="num">${comma(d.repoCount)}</td>
      <td class="num">${d.pctOfTotal!=null ? Number(d.pctOfTotal).toFixed(1)+'%' : '—'}</td>
    </tr>`
  ).join('');
}

fetch('/api/language')
  .then(r => r.json())
  .then(j => { if (j.code===0 && j.data) render(j.data); })
  .catch(() => { document.getElementById('chart').innerHTML = '<div class="loading-text">数据加载失败</div>'; });

window.addEventListener('resize', () => { if (chart) chart.resize(); });
</script>
</body>
</html>
