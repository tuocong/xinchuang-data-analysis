<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目排名 - 信创开源数据分析平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --surface-page:   #0d0d0d;
  --surface-1:      #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --series-1:       #3987e5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  min-height: 100vh;
}
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 28px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.navbar .brand { font-size: 17px; font-weight: 600; }
.navbar .btn-back {
  padding: 6px 16px; font-size: 12px; color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; text-decoration: none;
}
.navbar .btn-back:hover { border-color: var(--series-1); color: var(--series-1); }
.container { max-width: 1400px; margin: 0 auto; padding: 28px; }
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: var(--text-primary); }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px 24px;
}
.chart-box { width: 100%; height: 900px; }
.loading-text { color: var(--text-muted); font-size: 13px; text-align: center; padding: 80px 0; }
</style>
</head>
<body>

<nav class="navbar">
  <span class="brand">🏆 项目 Star 排名 TOP20</span>
  <a class="btn-back" href="dashboard.html">← 返回工作台</a>
</nav>

<div class="container">
  <div class="chart-card">
    <div class="chart-box" id="chart"></div>
  </div>
</div>

<script>
const DARK_TEXT = '#c3c2b7';
const DARK_MUTED = '#898781';
const DARK_GRID = '#2c2c2a';
const DARK_BASE = '#383835';
const SERIES_1 = '#3987e5';

function comma(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }
function compact(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function esc(s) { return s ?
String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

let chart;
function render(data) {
  if (!data || !data.length) return;
  const items = [...data].reverse();
  const dom = document.getElementById('chart');
  if (chart) chart.dispose();
  chart = echarts.init(dom);

  chart.setOption({
    title: {
      text: 'Star 排名 TOP20',
      subtext: '数据来源：ads_project_ranking',
      left: 'center', top: 8,
      textStyle: { color: '#ffffff', fontSize: 18, fontWeight: 600 },
      subtextStyle: { color: DARK_MUTED, fontSize: 12 }
    },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      backgroundColor: '#1a1a19', borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(p) {
        const d = p[0]; const row = items[d.dataIndex];
        return `<strong>#${row.ranking} ${esc(row.fullName)}</strong><br>
          <span style="color:${DARK_MUTED}">Star：</span><strong>${comma(row.starsCount)}</strong><br>
          <span style="color:${DARK_MUTED}">Fork：</span>${comma(row.forksCount)}<br>
          <span style="color:${DARK_MUTED}">平台：</span>${row.platform}  ·  ${row.language||'—'}`;
      }
    },
    grid: { left: 180, right: 100, top: 80, bottom: 24, containLabel: true },
    xAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: DARK_BASE } },
      axisTick: { show: false },
      axisLabel: { color: DARK_MUTED, fontSize: 11, formatter: compact },
      splitLine: { lineStyle: { color: DARK_GRID } },
    },
    yAxis: {
      type: 'category', inverse: false,
      axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: DARK_TEXT, fontSize: 13, width: 168, overflow: 'truncate' },
      data: items.map(d => (d.platform==='gitee'?'🟢 ':'🔵 ')+d.fullName),
    },
    series: [{
      type: 'bar',
      data: items.map(d => d.starsCount),
      itemStyle: { color: SERIES_1, borderRadius: [0,4,4,0] },
      barMaxWidth: 28,
      label: { show: true, position: 'right', color: DARK_TEXT, fontSize: 12, formatter: p => comma(p.value) },
      emphasis: { itemStyle: { color: '#5598e7' } },
    }],
  });
}

fetch('/api/ranking')
  .then(r => r.json())
  .then(j => { if (j.code===0 && j.data) render(j.data); })
  .catch(() => { document.getElementById('chart').innerHTML = '<div class="loading-text">数据加载失败</div>'; });

window.addEventListener('resize', () => { if (chart) chart.resize(); });
</script>
</body>
</html>
