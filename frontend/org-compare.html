<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组织对比 - 信创开源数据分析平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --surface-page:   #0d0d0d;
  --surface-1:      #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --series-3:       #199e70;
  --series-4:       #c98500;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  min-height: 100vh;
}
.navbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 28px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.navbar .brand { font-size: 17px; font-weight: 600; }
.navbar .btn-back {
  padding: 6px 16px; font-size: 12px; color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; text-decoration: none;
}
.navbar .btn-back:hover { border-color: var(--series-1); color: var(--series-1); }
.container { max-width: 1400px; margin: 0 auto; padding: 28px; }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px 24px; margin-bottom: 20px;
}
.chart-box { width: 100%; height: 550px; }
.loading-text { color: var(--text-muted); font-size: 13px; text-align: center; padding: 80px 0; }
</style>
</head>
<body>

<nav class="navbar">
  <span class="brand">🏢 组织活跃度对比 TOP15</span>
  <a class="btn-back" href="dashboard.html">← 返回工作台</a>
</nav>

<div class="container">
  <div class="chart-card">
    <div class="chart-box" id="chartStars"></div>
  </div>
  <div class="chart-card">
    <div class="chart-box" id="chartActive"></div>
  </div>
</div>

<script>
const DARK_TEXT = '#c3c2b7';
const DARK_MUTED = '#898781';
const DARK_GRID = '#2c2c2a';
const DARK_BASE = '#383835';
const SERIES_1 = '#3987e5';
const SERIES_2 = '#d95926';
const SERIES_3 = '#199e70';

function comma(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }
function compact(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function esc(s) { return s ?
String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

let chartStars, chartActive;

function render(data) {
  if (!data || !data.length) return;

  const top15 = data.slice(0, 15).reverse();

  const dom1 = document.getElementById('chartStars');
  if (chartStars) chartStars.dispose();
  chartStars = echarts.init(dom1);
  chartStars.setOption({
    title: { text: '组织 Total Star 排名 TOP15', left: 'center', top: 8, textStyle: { color: '#ffffff', fontSize: 18, fontWeight: 600 } },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      backgroundColor: '#1a1a19', borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(p) {
        const d = p[0]; const row = top15[d.dataIndex];
        return `<strong>${esc(row.orgName)}</strong><br>
          <span style="color:${DARK_MUTED}">Star：</span><strong>${comma(row.totalStars)}</strong><br>
          <span style="color:${DARK_MUTED}">仓库数：</span>${comma(row.repoCount)}<br>
          <span style="color:${DARK_MUTED}">活跃率：</span>${row.activeRate!=null ? Number(row.activeRate).toFixed(1)+'%' : '—'}`;
      }
    },
    grid: { left: 120, right: 100, top: 60, bottom: 24, containLabel: true },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: DARK_BASE } }, axisTick: { show: false }, axisLabel: { color: DARK_MUTED, fontSize: 11, formatter: compact }, splitLine: { lineStyle: { color: DARK_GRID } } },
    yAxis: { type: 'category', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: DARK_TEXT, fontSize: 12, width: 110, overflow: 'truncate' }, data: top15.map(d => d.orgName) },
    series: [{
      type: 'bar', data: top15.map(d => d.totalStars),
      itemStyle: { color: SERIES_1, borderRadius: [0,4,4,0] }, barMaxWidth: 22,
      label: { show: true, position: 'right', color: DARK_TEXT, fontSize: 11, formatter: p => compact(p.value) },
      emphasis: { itemStyle: { color: '#5598e7' } },
    }],
  });

  const dom2 = document.getElementById('chartActive');
  if (chartActive) chartActive.dispose();
  chartActive = echarts.init(dom2);
  chartActive.setOption({
    title: { text: '仓库数量 & 活跃率', left: 'center', top: 8, textStyle: { color: '#ffffff', fontSize: 18, fontWeight: 600 } },
    tooltip: { trigger: 'axis', backgroundColor: '#1a1a19', borderColor: '#383835', textStyle: { color: '#ffffff', fontSize: 13 } },
    legend: { data: ['仓库数','活跃率%'], bottom: 0, textStyle: { color: DARK_TEXT, fontSize: 12 } },
    grid: { left: 120, right: 100, top: 60, bottom: 40, containLabel: true },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: DARK_BASE } }, axisTick: { show: false }, axisLabel: { color: DARK_MUTED, fontSize: 11 }, splitLine: { lineStyle: { color: DARK_GRID } } },
    yAxis: { type: 'category', data: top15.map(d => d.orgName), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: DARK_TEXT, fontSize: 12, width: 110, overflow: 'truncate' } },
    series: [
      { name: '仓库数', type: 'bar', data: top15.map(d => d.repoCount), itemStyle: { color: SERIES_1, borderRadius: [0,4,4,0] }, barMaxWidth: 18, barGap: '30%', label: { show: true, position: 'right', color: DARK_TEXT, fontSize: 10, formatter: p => compact(p.value) } },
      { name: '活跃率%', type: 'bar', data: top15.map(d => Number(d.activeRate||0)), itemStyle: { color: SERIES_3, borderRadius: [0,4,4,0] }, barMaxWidth: 18, label: { show: true, position: 'right', color: DARK_TEXT, fontSize: 10, formatter: p => Number(p.value).toFixed(1)+'%' } },
    ],
  });
}

fetch('/api/org-compare')
  .then(r => r.json())
  .then(j => { if (j.code===0 && j.data) render(j.data); })
  .catch(() => { document.getElementById('chartStars').innerHTML = '<div class="loading-text">数据加载失败</div>'; });

window.addEventListener('resize', () => { if (chartStars) chartStars.resize(); if (chartActive) chartActive.resize(); });
</script>
</body>
</html>
