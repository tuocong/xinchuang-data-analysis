<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信创开源项目数据分析大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============================================================
   Design tokens — dark mode, palette.md reference instance
   ============================================================ */
:root {
  --surface-1:      #1a1a19;
  --surface-page:   #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --series-3:       #199e70;
  --series-4:       #c98500;
  --series-5:       #d55181;
  --series-6:       #008300;
  --series-7:       #9085e9;
  --series-8:       #e66767;
}

/* ============================================================
   Reset & base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  overflow-x: hidden;
}

/* ============================================================
   Dashboard shell
   ============================================================ */
.dashboard {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 100vh;
}

/* ---- header ---- */
.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 4px;
}
.header h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.header .update-time {
  color: var(--text-muted);
  font-size: 13px;
}

/* ---- KPI row ---- */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.kpi-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.kpi-label {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 0.03em;
}
.kpi-value {
  font-size: 36px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--text-primary);
}
.kpi-sub {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  gap: 12px;
}

/* ---- chart grid ---- */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.chart-row.full { grid-template-columns: 1fr; }

.chart-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px 12px;
  display: flex;
  flex-direction: column;
}
.chart-card .card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.chart-card .chart-box {
  flex: 1;
  min-height: 0;
}

/* ---- loading / empty ---- */
.loading-text {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  padding: 40px 0;
}

/* ---- responsive ---- */
@media (max-width: 1024px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .chart-row { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .kpi-row { grid-template-columns: 1fr; }
  .kpi-value { font-size: 28px; }
}
</style>
</head>
<body>

<div class="dashboard">
  <!-- ============================================================
       Header
       ============================================================ -->
  <div class="header">
    <h1>信创开源项目数据分析大屏</h1>
    <span class="update-time" id="updateTime">加载中…</span>
  </div>

  <!-- ============================================================
       KPI Row — 4 stat tiles
       ============================================================ -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card"><span class="kpi-label">总仓库数</span><span class="kpi-value">—</span></div>
    <div class="kpi-card"><span class="kpi-label">总 Star 数</span><span class="kpi-value">—</span></div>
    <div class="kpi-card"><span class="kpi-label">总 Fork 数</span><span class="kpi-value">—</span></div>
    <div class="kpi-card"><span class="kpi-label">平均 Star</span><span class="kpi-value">—</span></div>
  </div>

  <!-- ============================================================
       Row 2 — TOP20 排名 + 语言分布
       ============================================================ -->
  <div class="chart-row">
    <div class="chart-card">
      <div class="card-title">Star 排名 TOP20</div>
      <div class="chart-box" id="chartRanking" style="height:480px"></div>
    </div>
    <div class="chart-card">
      <div class="card-title">编程语言分布</div>
      <div class="chart-box" id="chartLanguage" style="height:480px"></div>
    </div>
  </div>

  <!-- ============================================================
       Row 3 — 月度趋势 + 组织对比
       ============================================================ -->
  <div class="chart-row">
    <div class="chart-card">
      <div class="card-title">月度趋势</div>
      <div class="chart-box" id="chartTrend" style="height:400px"></div>
    </div>
    <div class="chart-card">
      <div class="card-title">组织对比 TOP15</div>
      <div class="chart-box" id="chartOrg" style="height:400px"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   API helper
   ============================================================ */
const BASE = '';

async function fetchData(path) {
  try {
    const res = await fetch(BASE + path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.msg || 'API error');
    return json.data;
  } catch (err) {
    console.warn(`[fetch] ${path}:`, err.message);
    return null;
  }
}

/* ============================================================
   Formatters
   ============================================================ */
function compact(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)    return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function comma(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('en-US');
}

/* ============================================================
   ECharts dark theme defaults
   ============================================================ */
const DARK_TEXT = '#c3c2b7';
const DARK_MUTED = '#898781';
const DARK_GRID = '#2c2c2a';
const DARK_BASE = '#383835';
const SERIES_1 = '#3987e5';

function baseGrid() {
  return {
    left: 12, right: 24, top: 12, bottom: 8,
    containLabel: true,
  };
}

/* ============================================================
   Chart 1 — TOP20 横向柱状图
   ============================================================ */
function renderRanking(dom, data) {
  if (!data || !data.length) return;
  // Reverse so #1 is at top
  const items = [...data].reverse();
  const chart = echarts.init(dom);

  chart.setOption({
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      backgroundColor: '#1a1a19',
      borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(params) {
        const d = params[0];
        const row = items[d.dataIndex];
        return [
          `<strong style="font-size:14px">#${row.rank} ${escapeHtml(row.fullName)}</strong>`,
          `<span style="color:${DARK_MUTED}">Star：</span><strong>${comma(row.starsCount)}</strong>`,
          `<span style="color:${DARK_MUTED}">日增长：</span><strong style="color:${row.starGrowth > 0 ? '#0ca30c' : DARK_MUTED}">${row.starGrowth > 0 ? '+' : ''}${comma(row.starGrowth)}</strong>`,
          `<span style="color:${DARK_MUTED}">平台：</span>${row.platform}  ·  ${row.language || '—'}`,
        ].join('<br>');
      }
    },
    grid: { ...baseGrid(), left: 160, right: 80, top: 8, bottom: 8 },
    xAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: DARK_BASE } },
      axisTick: { show: false },
      axisLabel: { color: DARK_MUTED, fontSize: 11, formatter: compact },
      splitLine: { lineStyle: { color: DARK_GRID, width: 1 } },
    },
    yAxis: {
      type: 'category',
      inverse: false,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: {
        color: DARK_TEXT,
        fontSize: 12,
        width: 148,
        overflow: 'truncate',
        formatter: function(v) { return v; }
      },
      data: items.map(function(d) {
        return (d.platform === 'gitee' ? '🟢 ' : '🔵 ') + d.fullName;
      }),
    },
    series: [{
      type: 'bar',
      data: items.map(function(d) { return d.starsCount; }),
      itemStyle: {
        color: SERIES_1,
        borderRadius: [0, 4, 4, 0],
      },
      barMaxWidth: 22,
      label: {
        show: true,
        position: 'right',
        color: DARK_TEXT,
        fontSize: 11,
        formatter: function(p) { return comma(p.value); },
      },
      emphasis: {
        itemStyle: { color: '#5598e7' },
      },
    }],
  });

  return chart;
}

/* ============================================================
   Chart 2 — 语言分布环形图
   ============================================================ */
function renderLanguage(dom, data) {
  if (!data || !data.length) return;
  const CAT_COLORS = [
    '#3987e5', '#d95926', '#199e70', '#c98500',
    '#d55181', '#008300', '#9085e9', '#e66767'
  ];

  // Top 7 + fold rest into "其他"
  var slices = data.slice(0, 7);
  if (data.length > 7) {
    var rest = data.slice(7).reduce(function(acc, d) {
      acc.repoCount += d.repoCount;
      acc.totalStars += d.totalStars;
      return acc;
    }, { language: '其他', repoCount: 0, totalStars: 0 });
    slices.push(rest);
  }

  var chart = echarts.init(dom);
  chart.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: '#1a1a19',
      borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(p) {
        return [
          '<strong>' + escapeHtml(p.name) + '</strong>',
          '<span style="color:' + DARK_MUTED + '">仓库：</span>' + comma(p.value) + '  (' + p.percent + '%)',
        ].join('<br>');
      }
    },
    legend: {
      orient: 'vertical',
      right: 8,
      top: 'center',
      textStyle: { color: DARK_TEXT, fontSize: 12 },
      itemWidth: 10,
      itemHeight: 10,
      itemGap: 10,
    },
    series: [{
      type: 'pie',
      radius: ['50%', '76%'],
      center: ['40%', '50%'],
      avoidLabelOverlap: false,
      itemStyle: {
        borderColor: '#1a1a19',
        borderWidth: 2,
        borderRadius: 3,
      },
      label: {
        show: true,
        position: 'inside',
        color: '#ffffff',
        fontSize: 11,
        formatter: function(p) { return p.percent >= 5 ? p.percent + '%' : ''; },
      },
      emphasis: {
        scaleSize: 6,
        label: { fontSize: 15, fontWeight: 'bold' },
      },
      data: slices.map(function(d, i) {
        return {
          name: d.language,
          value: d.repoCount,
          itemStyle: { color: CAT_COLORS[i] },
        };
      }),
    }],
  });

  return chart;
}

/* ============================================================
   Chart 3 — 月度趋势 面积+折线（累积 Star）
   ============================================================ */
function renderTrend(dom, data) {
  if (!data || !data.length) return;
  var chart = echarts.init(dom);

  chart.setOption({
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#1a1a19',
      borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(params) {
        var rows = params.map(function(p) {
          return '<span style="color:' + DARK_MUTED + '">' + p.marker + ' ' +
            p.seriesName + '：</span><strong>' + comma(p.value) + '</strong>';
        });
        return '<strong>' + params[0].axisValue + '</strong><br>' + rows.join('<br>');
      }
    },
    grid: { ...baseGrid(), top: 12, bottom: 28, left: 12, right: 24 },
    xAxis: {
      type: 'category',
      data: data.map(function(d) { return d.month; }),
      axisLine: { lineStyle: { color: DARK_BASE } },
      axisTick: { show: false },
      axisLabel: { color: DARK_MUTED, fontSize: 11 },
    },
    yAxis: {
      type: 'value',
      name: '累计 Star',
      nameTextStyle: { color: DARK_MUTED, fontSize: 11 },
      axisLabel: { color: DARK_MUTED, fontSize: 11, formatter: compact },
      splitLine: { lineStyle: { color: DARK_GRID, width: 1 } },
    },
    series: [{
      name: '累计 Star',
      type: 'line',
      data: data.map(function(d) { return d.cumulativeStars; }),
      smooth: true,
      symbol: 'circle',
      symbolSize: 6,
      lineStyle: { color: SERIES_1, width: 2 },
      itemStyle: { color: SERIES_1, borderColor: '#1a1a19', borderWidth: 2 },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: 'rgba(57,135,229,0.18)' },
        { offset: 1, color: 'rgba(57,135,229,0.02)' },
      ])},
      markPoint: {
        data: [{ type: 'max', name: '峰值' }],
        symbolSize: 48,
        label: { color: DARK_TEXT, fontSize: 11 },
        itemStyle: { color: SERIES_1 },
      },
    }],
  });

  return chart;
}

/* ============================================================
   Chart 4 — 组织对比 TOP15 横向柱状图
   ============================================================ */
function renderOrgCompare(dom, data) {
  if (!data || !data.length) return;
  var items = data.slice(0, 15).reverse();
  var chart = echarts.init(dom);

  chart.setOption({
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      backgroundColor: '#1a1a19',
      borderColor: '#383835',
      textStyle: { color: '#ffffff', fontSize: 13 },
      formatter: function(params) {
        var d = params[0];
        return [
          '<strong>' + escapeHtml(d.name) + '</strong>',
          '<span style="color:' + DARK_MUTED + '">Star：</span><strong>' + comma(d.value) + '</strong>',
          '<span style="color:' + DARK_MUTED + '">平台：</span>' + (items[d.dataIndex].platform || '—'),
        ].join('<br>');
      }
    },
    grid: { ...baseGrid(), left: 100, right: 80, top: 8, bottom: 8 },
    xAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: DARK_BASE } },
      axisTick: { show: false },
      axisLabel: { color: DARK_MUTED, fontSize: 11, formatter: compact },
      splitLine: { lineStyle: { color: DARK_GRID, width: 1 } },
    },
    yAxis: {
      type: 'category',
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: {
        color: DARK_TEXT,
        fontSize: 12,
        width: 90,
        overflow: 'truncate',
      },
      data: items.map(function(d) { return d.orgName; }),
    },
    series: [{
      type: 'bar',
      data: items.map(function(d) { return d.totalStars; }),
      itemStyle: {
        color: SERIES_1,
        borderRadius: [0, 4, 4, 0],
      },
      barMaxWidth: 22,
      label: {
        show: true,
        position: 'right',
        color: DARK_TEXT,
        fontSize: 11,
        formatter: function(p) { return comma(p.value); },
      },
      emphasis: {
        itemStyle: { color: '#5598e7' },
      },
    }],
  });

  return chart;
}

/* ============================================================
   KPI rendering
   ============================================================ */
function renderKPI(data) {
  if (!data) return;
  var cards = document.querySelectorAll('.kpi-card');
  if (cards.length >= 4) {
    cards[0].querySelector('.kpi-value').textContent = comma(data.totalRepos);
    cards[0].querySelector('.kpi-label').innerHTML = '总仓库数 <span style="font-size:11px;color:#898781">🟢Gitee ' + comma(data.giteeRepos) + '  🔵GitHub ' + comma(data.githubRepos) + '</span>';

    cards[1].querySelector('.kpi-value').textContent = compact(data.totalStars);

    cards[2].querySelector('.kpi-value').textContent = compact(data.totalForks);

    cards[3].querySelector('.kpi-value').textContent = comma(data.avgStars);
  }
  document.getElementById('updateTime').textContent = '数据日期：' + (data.statDate || '—');
}

/* ============================================================
   Utility
   ============================================================ */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ============================================================
   Main — fetch all, render all
   ============================================================ */
var charts = {};

function disposeChart(key) {
  if (charts[key]) { charts[key].dispose(); charts[key] = null; }
}

async function loadAll() {
  var results = await Promise.all([
    fetchData('/api/overview'),
    fetchData('/api/ranking'),
    fetchData('/api/language'),
    fetchData('/api/trend'),
    fetchData('/api/org-compare'),
  ]);

  var overview = results[0];
  var ranking  = results[1];
  var language = results[2];
  var trend    = results[3];
  var orgCmp   = results[4];

  renderKPI(overview);

  disposeChart('ranking');
  disposeChart('language');
  disposeChart('trend');
  disposeChart('org');

  var rDom = document.getElementById('chartRanking');
  var lDom = document.getElementById('chartLanguage');
  var tDom = document.getElementById('chartTrend');
  var oDom = document.getElementById('chartOrg');

  if (ranking)  charts.ranking  = renderRanking(rDom, ranking);
  if (language) charts.language = renderLanguage(lDom, language);
  if (trend)    charts.trend    = renderTrend(tDom, trend);
  if (orgCmp)   charts.org      = renderOrgCompare(oDom, orgCmp);
}

/* ============================================================
   Resize handling
   ============================================================ */
window.addEventListener('resize', function() {
  Object.values(charts).forEach(function(c) { if (c && c.resize) c.resize(); });
});

/* ============================================================
   Auto-refresh every 5 minutes
   ============================================================ */
loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>

</body>
</html>
